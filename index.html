<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Caught, Not Taught: IaC transcripts</title>
<link rel="stylesheet" href="style.css">
<script>try { var t = localStorage.getItem("cnt-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" id="brand">Transcripts</a>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <button class="theme" id="theme" type="button" title="Switch theme (t)" aria-label="Switch between light and dark theme">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg>
  </button>
</header>
<main id="app" tabindex="-1"><p class="notice">Loading transcripts…</p></main>
<noscript><p class="notice">This viewer needs JavaScript to render the transcripts.</p></noscript>
<script src="data/index.js"></script>
<script src="app.js"></script>
</body>
</html>
